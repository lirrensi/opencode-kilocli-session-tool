[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm"
version = "0.1.1"
description = "OpenCode Session Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0.50"]

[project.scripts]
osm = "osm:main"

[tool.setuptools]
py-modules = ["osm"]
